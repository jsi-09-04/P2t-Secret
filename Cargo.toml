[package]
name = "p2tsecret"
version = "0.1.0"
edition = "2021"
description = "Gestionnaire sécurisé d'identifiants multi-OS avec 2FA Microsoft Authenticator et UI egui"
authors = ["Projet2Team <contact@projet2team.com>"]

[dependencies]
# GUI Native Immediate Mode
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.30"

# Cryptographie militaire & Sécurité mémoire
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rand = "0.8"

# 2FA Microsoft Authenticator & QR Code
totp-rs = { version = "5.6", features = ["gen_secret", "otpauth"] }
qrcodegen = "1.8"

# Sérialisation & Données
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

# Presse-papier système multi-plateforme (Linux, Windows, macOS)
arboard = "3.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
